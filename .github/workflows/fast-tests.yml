name: OpenStonekeep FAST tests

on:
  push:
    branches: [main, research/stone-k291-cell-structure]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/fast-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "tools/**"
      - "tests/**"
      - ".github/workflows/fast-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openstonekeep-fast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pytest
      - run: python -m pytest -q
